name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate

      - name: Build
        run: |
          xcodebuild \
            -project XianyuCollector.xcodeproj \
            -scheme XianyuCollector \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload

          cp -R \
            build/Build/Products/Release-iphoneos/XianyuCollector.app \
            Payload/

          zip -r \
            XianyuCollector.ipa \
            Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: XianyuCollector-IPA
          path: XianyuCollector.ipa
